name: deployed writing assistant
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-assistant-screenshots
          path: live-test-results/
